[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "MIT OR Apache-2.0"
publish = false

[workspace.dependencies]
anvil-forge = { path = "crates/anvil-forge" }
anvil-schema = { path = "crates/anvil-schema" }
anvil-fastload = { path = "crates/anvil-fastload" }
acb-world = { path = "crates/acb-world" }
thiserror = "2"
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
