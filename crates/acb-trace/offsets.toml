# acb-trace offsets for retail ACBMP.exe (PC, 32-bit). Edit and keep next to the binary
# (or pass --offsets FILE): no rebuild needed. Values are hex or decimal; `rva` values are
# relative to the module base taken from /proc/<pid>/maps. How each was derived and its
# confidence: ~/.cache/acbmp-re/findings/retail-mem.md (summary in the kit README).
# A missing/zero optional offset means "scan for it at attach time"; `check` prints what it
# found so the value can be pinned here.

# EngineContextImp::ms_Instance (global pointer), MEDIUM
engine_ctx_rva = 0x022623f0
# current game world inside EngineContextImp, MEDIUM (validated: must be class World)
world_off = 0x4c
# world -> player pad manager pointer (its +4 is the player array); 0 = scan world+0..0x2000
pad_mgr_off = 0
# player array slot of the local pad
pad_slot = 0
# entity -> component array (pointer; u16 count at +6, & 0x3fff); 0 = scan
components_off = 0
# entity -> 4x4 world matrix (16 floats); 0 = scan for an orthonormal matrix
matrix_off = 0
# matrix stored with the translation in floats 3/7/11 instead of 12/13/14
transpose = false
# AIActor -> current context of track 0 (AIActor::GetCurrentContext: +0x18 + track*0x30), HIGH
actor_context_off = 0x18
# context -> its Human*Data object (DataContext::GetActorContextData), MEDIUM; 0 = scan +0..0x40
context_data_off = 0x10
# frame counter / game clock (u32 at world + clock_off); 0 = none, use host time
clock_off = 0

# class ids (GetClassID, same on Mac and PC). Name "HumanXData" -> state "HumanX".
class.Entity = 0x0984415e
