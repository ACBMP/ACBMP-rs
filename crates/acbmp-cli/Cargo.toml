[package]
name = "acbmp-cli"
version = "0.1.0"
description = "Developer CLI for inspecting ACB MP game data"
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "acbmp"
path = "src/main.rs"

[dependencies]
anvil-forge.workspace = true
anyhow.workspace = true
clap.workspace = true
anvil-schema.workspace = true
anvil-fastload.workspace = true
serde_json = "1.0.154"
acb-world.workspace = true
acb-render.workspace = true
png = "0.18.1"
pollster = "1.0.1"
glam = "0.34.1"
d3d9-shader.workspace = true
naga = { version = "30", features = ["wgsl-in"] }
